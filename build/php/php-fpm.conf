; StackManage PHP 8.5.12 FPM defaults.
;
; Relative paths are resolved against PHP's install prefix. The StackManage
; worker will start the managed binary with an explicit -p prefix and may render
; a private copy of this file. The defaults below are safe for a non-root master
; process and write logs under the install prefix instead of a root-owned system
; path.

[global]
pid = var/run/php-fpm.pid
error_log = var/log/php-fpm.log
log_level = notice
daemonize = no
process_control_timeout = 10s
include = etc/php-fpm.d/*.conf
