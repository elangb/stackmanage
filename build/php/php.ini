; StackManage PHP 8.5.12 runtime defaults.
;
; This file is part of the reproducible runtime artifact. The StackManage worker
; will render a per-installation copy later; these defaults are deliberately
; non-destructive and suitable for Laravel/WordPress development.
;
; All extensions in this build are linked statically, so no extension= lines are
; required. OPcache is built into PHP 8.5 itself and must not be loaded with
; zend_extension=opcache.so.

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
disable_functions =
disable_classes =
zend.exception_ignore_args = On
expose_php = Off

max_execution_time = 30
max_input_time = 60
max_input_vars = 3000
memory_limit = 256M

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log =
html_errors = Off

post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20

allow_url_fopen = On
allow_url_include = Off
cgi.fix_pathinfo = 0
default_charset = "UTF-8"
default_mimetype = "text/html"
date.timezone = UTC

realpath_cache_size = 4096K
realpath_cache_ttl = 120

[Session]
session.save_handler = files
session.use_strict_mode = 1
session.use_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.sid_length = 48
session.sid_bits_per_character = 6

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1

[Phar]
phar.readonly = On
