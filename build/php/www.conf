; StackManage default PHP-FPM pool.
;
; The build-time default user/group are www-data (the Ubuntu base image has
; them). A non-root master ignores these directives; the StackManage worker will
; render the final user/group for the current desktop user. Keep the surface
; loopback-only until the worker adds an authenticated proxy.

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1
listen.backlog = 511

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

pm.status_path = /status
ping.path = /ping
ping.response = pong

access.log = /dev/null
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php

env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

php_admin_flag[log_errors] = on
