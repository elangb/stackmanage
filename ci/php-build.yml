name: StackManage PHP runtime

# Inactive template, same handoff rule as checks.yml and platform.yml: GitHub
# only runs repository-root .github/workflows. Activating this job requires an
# explicit decision outside this branch. No CI execution is claimed by this
# file, and no artifact is produced in the authoring environment because no
# container runtime is installed there.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'stackmanage/build/php/**'
      - 'stackmanage/scripts/php/**'
      - 'stackmanage/ci/php-build.yml'
      - 'stackmanage/docs/php-build-runner.md'
      - 'stackmanage/docs/reports/phase8-php-runner.md'

permissions:
  contents: read

concurrency:
  group: stackmanage-php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-runtime:
    name: Build PHP 8.5.12 runtime (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: stackmanage
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      STACKMANAGE_CONTAINER_ENGINE: docker
      STACKMANAGE_BUILD_TIMEOUT: '3600'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show container runtime
        run: docker version

      - name: Build and export artifact
        run: ./scripts/php/build-php-runtime.sh --output-dir release/php --jobs 4

      - name: Verify artifact
        run: ./scripts/php/build-php-runtime.sh --verify-only --output-dir release/php

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-8.5.12-linux-x64
          path: |
            stackmanage/release/php/php-8.5.12-linux-x64.tar.gz
            stackmanage/release/php/php-8.5.12-linux-x64.tar.gz.sha256
            stackmanage/release/php/php-8.5.12-linux-x64.manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-8.5.12-build-log
          path: stackmanage/release/php/build.log
          if-no-files-found: ignore
          retention-days: 7
