appId: com.stackmanage.app
electronVersion: 45.2.2
productName: StackManage
executableName: stackmanage
copyright: Copyright © 2026 StackManage contributors
directories:
  app: apps/desktop
  output: release
  buildResources: build
asar: false
files:
  - dist/**/*
  - package.json
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE
  - from: build/icon.png
    to: icon.png
artifactName: StackManage-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Development
  icon: ../../build/icon.png
  maintainer: StackManage contributors <maintainers@stackmanage.invalid>
  synopsis: Native local development workspace
  description: StackManage manages native local runtimes, services and local sites without containers.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
portable:
  artifactName: StackManage-${version}-portable.${ext}
publish:
  provider: github
  owner: elangb
  repo: stackmanage
